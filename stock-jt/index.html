<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stock John Taylor · Smarthub</title>
<link rel="icon" type="image/png" href="/brand/smartshop-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}

/* Même charte que le Smarthub et Digital. Un en-tête, des onglets, une vue ; les fiches s'ouvrent dans un panneau latéral. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #111214; --muted: #5E6470; --line: #E3E6EB;
  --magenta: #E50E7E; --yellow: #F2D600; --cyan: #1C9DD9; --hover: #F0F2F5; --green: #2E9E63; --warn: #C27A00;
  --display: "Lexend", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --logo-filter: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1114; --surface: #171A1F; --ink: #F1F2F4; --muted: #9AA1AD; --line: #2A2F37; --hover: #1E2228;
  --yellow: #F9EB1E; --magenta: #FF4FA3; --green: #4CC38A; --warn: #F2C200; --logo-filter: invert(1) hue-rotate(180deg); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1114; --surface: #171A1F; --ink: #F1F2F4; --muted: #9AA1AD; --line: #2A2F37; --hover: #1E2228;
  --yellow: #F9EB1E; --magenta: #FF4FA3; --green: #4CC38A; --warn: #F2C200; --logo-filter: invert(1) hue-rotate(180deg); color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; }
header { display: grid; gap: 18px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { width: min(220px, 60vw); height: auto; filter: var(--logo-filter); display: block; }
.retour { font-size: 13.5px; color: var(--muted); text-decoration: none; }
.retour:hover { color: var(--ink); text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 68ch; }
.cmyk { display: inline-flex; gap: 5px; vertical-align: middle; margin-left: 6px; }
.cmyk i { width: 8px; height: 8px; border-radius: 50%; display: block; }
h2 { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.user-chip { display: inline-flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.user-chip button { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; }

.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--magenta); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 1px solid transparent; background: none; border-radius: 8px; width: 30px; height: 30px; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }

/* Onglets */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.tabs button { border: 0; background: none; padding: 10px 14px; font: 600 14px var(--body); color: var(--muted); white-space: nowrap;
  border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--magenta); }
.pill { font: 600 11.5px var(--display); background: var(--magenta); color: #fff; border-radius: 99px; padding: 1px 7px; }
.pill.zero { background: var(--hover); color: var(--muted); }

/* Résumé */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; text-align: left; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
button.stat { transition: border-color .18s ease, transform .18s ease; }
button.stat:hover { border-color: var(--ink); transform: translateY(-2px); }
.stat .v { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 13px; }
.stat.alerte .v { color: var(--magenta); } .stat.ok .v { color: var(--green); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bloc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }

/* Filtres */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input[type=search], .toolbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 38px; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; }
.toolbar .spacer { flex: 1; }

.banner { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; color: var(--muted); }
.banner.alerte { border-color: var(--magenta); color: var(--ink); }
.banner.alerte b { color: var(--magenta); }
.banner pre { white-space: pre-wrap; background: var(--hover); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--ink); overflow-x: auto; }

/* Tableaux */
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font: 500 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.clic { cursor: pointer; }
tbody tr.clic:hover { background: var(--hover); }
tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
td .sub { color: var(--muted); font-size: 12.5px; display: block; }
.vig { display: inline-grid; place-items: center; position: relative; flex: none; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); font: 600 14px var(--display); overflow: hidden; vertical-align: middle; }
.vig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
.art { display: flex; gap: 10px; align-items: center; min-width: 0; }
/* Tableau resserré : titres sur deux lignes, pour tenir dans la largeur sans défilement. */
a.sellsy { color: inherit; text-decoration: underline; text-decoration-color: var(--magenta); text-underline-offset: 3px; }
a.sellsy:hover { color: var(--magenta); }
.compact th { white-space: pre-line; line-height: 1.25; vertical-align: bottom; padding: 8px; letter-spacing: .04em; }
.compact td { padding: 8px; }
.compact td.r { white-space: normal; }
.compact td.r > b, .compact td.r > span:not(.sub) { white-space: nowrap; }
.neg { color: var(--magenta); font-weight: 600; }
.bas { color: var(--warn); font-weight: 600; }
.etat { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.etat::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }
.tag { display: inline-flex; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.alerte { border-color: var(--magenta); color: var(--magenta); }
.empty { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 48px 16px; color: var(--muted);
  background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
.empty strong { color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 18px; }
.barre { height: 8px; background: var(--hover); border-radius: 4px; overflow: hidden; min-width: 70px; }
.barre i { display: block; height: 100%; background: var(--cyan); }

/* Panneau */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .4); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100%); z-index: 21; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -16px 0 40px -20px rgba(0,0,0,.4); display: flex; flex-direction: column; }
.panel-h { display: flex; align-items: flex-start; gap: 8px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.panel-h h3 { flex: 1; font-size: 19px; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: 20px; align-content: start; }
.panel-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lbl { font: 500 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, td input, td select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.field textarea { min-height: 70px; resize: vertical; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--magenta); }
.lignes td { padding: 5px 6px; border: 0; }
.lignes td input, .lignes td select { padding: 6px 8px; }
.lignes input.n { text-align: right; width: 84px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: 92vw; }

/* Connexion */
body.verrou .wrap { display: none; }
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; display: grid; gap: 16px; }
.gate-card img { width: 200px; filter: var(--logo-filter); }
.gate-card h1 { font-size: 22px; }
.gate-card p { margin: 0; color: var(--muted); }
.gerr { color: var(--magenta) !important; }
.gbtn { font: 600 15px var(--body); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.gbtn.secondaire { background: transparent; color: var(--ink); }

@media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr; } .wrap { padding-block: 24px 40px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .tabs, .toolbar, .top-right, .user-chip, .btn { display: none !important; } body { background: #fff; } }
</style>
</head>
<body class="verrou">
<div class="gate" id="gate"><div class="gate-card"><p>Chargement…</p></div></div>
<div class="wrap">
<header>
  <div class="top">
    <a href="/" aria-label="Retour au Smarthub"><img class="logo" src="/brand/smartshop-logo.png" alt="smartshop"></a>
    <div class="top-right"><a class="retour" href="/">← Tous les outils</a></div>
  </div>
  <div class="top">
    <div style="display:grid;gap:6px">
      <h1>Stock John Taylor<span class="cmyk" aria-hidden="true"><i style="background:var(--magenta)"></i><i style="background:var(--yellow)"></i><i style="background:var(--cyan)"></i></span></h1>
      <p class="lead">Goodies en stock du réseau John Taylor : achats du siège, commandes des agences, stock restant et rétrocession à reverser, au même endroit.</p>
    </div>
    <span class="user-chip" id="userChip"></span>
  </div>
</header>
<div id="notice"></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
<main id="vue" style="display:grid;gap:18px"></main>
</div>
<div id="overlay"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";
  const firebaseConfig = {apiKey: "AIzaSyDSb3lmftpgG-fRvlkl7YHhTiwA_veN1Ck", authDomain: "smartshop-catalogues.firebaseapp.com",
    projectId: "smartshop-catalogues", storageBucket: "smartshop-catalogues.firebasestorage.app",
    messagingSenderId: "161620663653", appId: "1:161620663653:web:8a89f06f89597b57d9d58c"};
  // Données : Firestore, stock_jt/base/<collection>. Accès externes : stock_jt_acces/<e-mail>.
  const COLS = ["articles", "achats", "commandes", "entites", "inventaires", "versements"];
  const ETATS = ["À facturer", "À régler", "Réglé", "Non rétrocédé", "Annulée", "Inconnu"];
  const ETAT_C = { "À facturer": "var(--magenta)", "À régler": "var(--warn)", "Réglé": "var(--green)", "Non rétrocédé": "var(--muted)", "Annulée": "var(--muted)", "Inconnu": "var(--cyan)" };
  const SOURCES = ["Nouveau site", "Ancien site", "Hors site"];
  const FACTURE_SUR = ["JT SA (siège)", "Nom propre (filiale)", "John Taylor Corporate (siège Monaco)"];
  const JOURS_FACTURE = 30, JOURS_PAIEMENT = 45, SEUIL_BAS = 0.1;
  // ?local=1 : mode essai, les données restent dans ce navigateur (aucune connexion, rien n'est partagé).
  const LOCAL = new URLSearchParams(location.search).get("local") === "1";

  const $ = s => document.querySelector(s);
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "style") e.style.cssText = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k in e && k !== "list") e[k] = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : String(kid));
    return e;
  }
  const eur = n => (Math.round((n || 0) * 100) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
  const nb = n => (Math.round((n || 0) * 100) / 100).toLocaleString("fr-FR");
  const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
  const r2 = n => Math.round(n * 100) / 100;
  const dateFr = d => d ? d.split("-").reverse().join("/") : "—";
  const auj = () => new Date().toISOString().slice(0, 10);
  const triDe = d => d ? d.slice(0, 4) + "-T" + (Math.floor((+d.slice(5, 7) - 1) / 3) + 1) : "";
  const triFr = t => t ? t.replace("-", " ") : "Sans trimestre";
  const finTri = t => { const y = +t.slice(0, 4), q = +t.slice(6); return new Date(Date.UTC(y, q * 3, 0)).toISOString().slice(0, 10); };
  const joursDepuis = d => d ? Math.floor((Date.now() - Date.parse(d)) / 864e5) : null;
  const slug = s => String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let toastT;
  function toast(msg) { document.querySelector(".toast")?.remove(); const t = h("div", { class: "toast", role: "status" }, msg); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4200); }

  // ------------------------------------------------------------ Stockage
  const db = Object.fromEntries(COLS.map(c => [c, []])); db.acces = [];
  const state = { tab: location.hash.slice(1) || "synthese", me: null, refus: false, loaded: false,
    cmd: { q: "", tri: "", etat: "", source: "" }, stock: { q: "", cat: "", vue: "theorique" }, retroTri: null };
  let fs = null;
  const store = LOCAL ? {
    async load() { const d = JSON.parse(localStorage.getItem("stockjt-local") || "{}"); for (const c of [...COLS, "acces"]) db[c] = d[c] || []; },
    _save() { localStorage.setItem("stockjt-local", JSON.stringify(db)); },
    async set(col, doc) { const i = db[col].findIndex(x => x.id === doc.id); i < 0 ? db[col].push(doc) : db[col][i] = doc; this._save(); },
    async del(col, id) { db[col] = db[col].filter(x => x.id !== id); this._save(); },
    async bulk(col, docs) { for (const d of docs) { const i = db[col].findIndex(x => x.id === d.id); i < 0 ? db[col].push(d) : db[col][i] = d; } this._save(); },
  } : {
    ref(col) { return col === "acces" ? fs.collection("stock_jt_acces") : fs.collection("stock_jt").doc("base").collection(col); },
    async load() {
      const snaps = await Promise.all([...COLS, "acces"].map(c => this.ref(c).get()));
      [...COLS, "acces"].forEach((c, i) => db[c] = snaps[i].docs.map(d => ({ ...d.data(), id: d.id })));
    },
    async set(col, doc) { const { id, ...data } = doc; await this.ref(col).doc(id).set({ ...data, majPar: state.me.email, majLe: new Date().toISOString() });
      const i = db[col].findIndex(x => x.id === id); i < 0 ? db[col].push(doc) : db[col][i] = doc; },
    async del(col, id) { await this.ref(col).doc(id).delete(); db[col] = db[col].filter(x => x.id !== id); },
    async bulk(col, docs) {
      for (let i = 0; i < docs.length; i += 400) {
        const b = fs.batch();
        for (const d of docs.slice(i, i + 400)) { const { id, ...data } = d; b.set(this.ref(col).doc(id), data); }
        await b.commit();
      }
      for (const d of docs) { const i = db[col].findIndex(x => x.id === d.id); i < 0 ? db[col].push(d) : db[col][i] = d; }
    },
  };
  // ------------------------------------------------------------ Sauvegardes et historique
  // Chaque modification est notée dans stock_jt/base/journal (qui, quand, avant, après). Une copie complète
  // des données part dans stock_jt/base/sauvegardes dans les 30 secondes qui suivent la dernière modification
  // (les modifications faites à la suite sont regroupées). Les 100 dernières copies automatiques sont gardées.
  const MAX_AUTO = 100, DELAI_SAUVEGARDE = 30000, MORCEAU = 900000;
  const S = { liste: [], journal: [], timer: null, enCours: null, erreur: "", tout: false, toutJ: false };
  const lsLire = k => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (_) { return []; } };
  const coffre = LOCAL ? {
    async liste() { return lsLire("stockjt-local-sauv").map(({ contenu, ...m }) => m); },
    async ecrire(meta, contenu) { let l = [{ ...meta, contenu }, ...lsLire("stockjt-local-sauv")].slice(0, 6);
      for (;;) { try { localStorage.setItem("stockjt-local-sauv", JSON.stringify(l)); break; } catch (e) { if (l.length <= 1) throw e; l.pop(); } } },
    async lire(id) { return lsLire("stockjt-local-sauv").find(x => x.id === id)?.contenu; },
    async effacer(id) { localStorage.setItem("stockjt-local-sauv", JSON.stringify(lsLire("stockjt-local-sauv").filter(x => x.id !== id))); },
    async noter(e) { try { localStorage.setItem("stockjt-local-journal", JSON.stringify([e, ...lsLire("stockjt-local-journal")].slice(0, 150))); } catch (_) {} },
    async journal(n) { return lsLire("stockjt-local-journal").slice(0, n); },
  } : {
    col() { return fs.collection("stock_jt").doc("base").collection("sauvegardes"); },
    async liste() { return (await this.col().orderBy("date", "desc").limit(300).get()).docs.map(d => ({ ...d.data(), id: d.id })); },
    // La fiche de la sauvegarde est écrite en dernier : une sauvegarde visible dans la liste est toujours complète.
    async ecrire(meta, contenu) { const { id, ...m } = meta, n = Math.ceil(contenu.length / MORCEAU);
      for (let i = 0; i < n; i++) await this.col().doc(id).collection("morceaux").doc(String(i).padStart(3, "0")).set({ t: contenu.slice(i * MORCEAU, (i + 1) * MORCEAU) });
      await this.col().doc(id).set({ ...m, morceaux: n }); },

  const quand = iso => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });

  function creerSauvegarde(type, motif) {

      const meta = { id: date.replace(/\D/g, "").slice(0, 14) + "-" + Math.random().toString(36).slice(2, 6), date, par: state.me.email, type, motif: motif || "", compte: Object.fromEntries(COLS.map(c => [c, db[c].length])) };
      await coffre.ecrire(meta, ascii(instantane()));
      S.liste.unshift(meta); S.erreur = "";

  const autoSauvegarde = motif => creerSauvegarde("auto", motif).catch(e => { console.error("Sauvegarde automatique", e); S.erreur = e.code || e.message || "erreur"; toast("La sauvegarde automatique n'a pas pu être enregistrée (" + S.erreur + ")."); });
  // À appeler après chaque écriture réussie.

  // Avant une opération en masse : s'assurer que l'état actuel a bien sa sauvegarde.
  async function sauvegardeAvant(motif) { if (S.timer || !S.liste.length) await creerSauvegarde("auto", motif); }
  // À l'ouverture : charge la liste, et rattrape une sauvegarde manquante (page fermée trop vite, premier lancement).
  async function rattraper() {

  }
  const libelle = (col, d) => !d ? "" : col === "commandes" ? "Commande " + (d.numero || d.id) : col === "articles" ? "Article " + (d.nom || d.id)

  async function sauver(col, doc, msg) {

  async function restaurer(x) {

  // ------------------------------------------------------------ Calculs
  // Règles : seuls les articles « en stock » sont suivis. Le stock part des achats du siège et diminue des
  // commandes des agences (sauf commandes annulées). La rétrocession additionne, par trimestre, les lignes
  // produits HT (jamais les frais de port) des articles « en stock » et « à rétrocéder ».
  let C = null;
  function calculer() {
    const art = new Map(db.articles.map(a => [a.id, a]));
    const st = new Map(db.articles.map(a => [a.id, { a, achete: 0, valAchat: 0, vendu: 0, apresAchat: 0, apresVente: 0, inv: null }]));
    for (const i of db.inventaires) { const s = st.get(i.articleId); if (s && (!s.inv || i.date > s.inv.date)) s.inv = i; }
    for (const a of db.achats) { const s = st.get(a.articleId); if (!s) continue; s.achete += a.quantite; s.valAchat += a.totalHT;
      if (s.inv && a.date && a.date > s.inv.date) s.apresAchat += a.quantite; }
    const tris = new Map();
    const triDeCmd = c => c.trimestre || triDe(c.date) || "";
    for (const c of db.commandes) {
      const annulee = c.etat === "Annulée";
      c._tri = triDeCmd(c); c._total = 0; c._retro = 0; c._sansArticle = 0;
      for (const l of c.lignes || []) {
        c._total += l.totalHT || 0;
        const a = art.get(l.articleId);
        if (!a) { c._sansArticle++; continue; }
        if (!a.enStock || annulee) continue;
        const s = st.get(a.id); s.vendu += l.quantite || 0;
        if (s.inv && c.date && c.date > s.inv.date) s.apresVente += l.quantite || 0;
        if (a.aRetroceder && !c.retroExclue) c._retro += l.totalHT || 0;
      }
      if (annulee || c.retroExclue) c._retro = 0;
      if (c._retro || (!annulee && !c.retroExclue)) {
        const t = tris.get(c._tri) || { tri: c._tri, total: 0, regle: 0, aRegler: 0, aFacturer: 0, autre: 0, n: 0, verse: 0 };
        t.total += c._retro; t.n++;
        t[c.etat === "Réglé" ? "regle" : c.etat === "À régler" ? "aRegler" : c.etat === "À facturer" ? "aFacturer" : "autre"] += c._retro;
        tris.set(c._tri, t);
      }
    }
    for (const v of db.versements) { const t = tris.get(v.trimestre) || { tri: v.trimestre, total: 0, regle: 0, aRegler: 0, aFacturer: 0, autre: 0, n: 0, verse: 0 }; t.verse += v.montant; tris.set(v.trimestre, t); }
    const stock = [...st.values()].filter(s => s.a.enStock).map(s => {
      const theorique = s.achete - s.vendu;
      const actuel = s.inv ? s.inv.quantite + s.apresAchat - s.apresVente : theorique;
      const ecart = s.inv ? s.inv.quantite - (theorique - s.apresAchat + s.apresVente) : null;
      const pmp = s.achete ? s.valAchat / s.achete : 0;
      return { ...s, theorique, actuel, ecart, pmp, valeur: Math.max(actuel, 0) * pmp };
    }).sort((x, y) => x.a.nom.localeCompare(y.a.nom, "fr"));
    const trimestres = [...tris.values()].sort((x, y) => (y.tri || "0").localeCompare(x.tri || "0"));

    C.controles = controler();

  }
  function controler() {
    const out = [], add = (type, grave, texte, cible) => out.push({ type, grave, texte, cible });
    const vus = new Map();
    for (const c of db.commandes) {
      const cible = { cmd: c.id }, nom = "Commande " + c.numero;
      if (vus.has(c.numero)) add("Doublon", true, nom + " est enregistrée deux fois.", cible); vus.set(c.numero, 1);
      if (c.etat === "Annulée") continue;
      if (c._sansArticle) add("Produit à identifier", true, nom + " : " + c._sansArticle + " ligne(s) sans article du catalogue, non comptée(s) dans le stock ni la rétrocession.", cible);
      if (!c._tri) add("Trimestre manquant", true, nom + " n'a ni date ni trimestre : " + eur(c._retro) + " hors des totaux trimestriels.", cible);
      if (c.etat === "Inconnu") add("État de facture inconnu", false, nom + " (" + eur(c._total) + ") : facture et paiement à renseigner.", cible);
      const age = joursDepuis(c.date);
      if (c.etat === "À facturer" && (age == null || age > JOURS_FACTURE)) add("Commande non facturée", true, nom + " (" + eur(c._total) + ") n'est pas facturée" + (age != null ? " depuis " + age + " jours." : "."), cible);
      if (c.etat === "À régler" && age != null && age > JOURS_PAIEMENT) add("Facture non payée", false, nom + " (" + eur(c._total) + ") : facture " + (c.facture || "") + " à régler depuis " + age + " jours.", cible);
      if (c.etat !== "À facturer" && c.etat !== "Inconnu" && !c.facture && !c.factureNum && !c.retroExclue) add("Numéro de facture manquant", false, nom + " est marquée « " + c.etat + " » sans numéro de facture.", cible);
      if (c.importAuto && c.monday && c.monday.present === false && (age == null || age >= 1)) add("Commande absente de Monday", false, nom + " vient du nouveau site mais n'a pas été trouvée sur les tableaux Monday John Taylor.", cible);
      if (c.importAuto && c.sellsyMontantHT != null && !c.lignesHorsCatalogue && Math.abs(c.sellsyMontantHT - c._total) > 0.01) add("Écart avec la facture Sellsy", true, nom + " : " + eur(c._total) + " de produits dans l'outil, " + eur(c.sellsyMontantHT) + " hors port sur la facture " + (c.facture || "") + ".", cible);
      if (c.ecartSite) add("Écart site / facture", false, nom + " : " + eur(c.ecartSite.site) + " sur le site, " + eur(c.ecartSite.facture) + " facturés. Les lignes suivent la facture.", cible);
    }
    for (const s of C.stock) {
      if (s.actuel < 0) add("Stock négatif", true, s.a.nom + " : " + nb(s.actuel) + " en stock. Il manque un achat du siège, ou une commande est comptée en trop.", { stock: s.a.id });
      else if (s.ecart) add("Écart d'inventaire", false, s.a.nom + " : " + nb(s.inv.quantite) + " comptés le " + dateFr(s.inv.date) + " pour " + nb(s.inv.quantite - s.ecart) + " attendus (" + (s.ecart > 0 ? "+" : "") + nb(s.ecart) + ").", { stock: s.a.id });
    }
    // Rapprochement avec le site : stockWoo = relevé du stock déclaré par WooCommerce (import « fusion »).
    for (const s of C.stock) {
      const w = s.a.stockWoo; if (!w) continue;
      const le = w.le ? " (relevé du " + dateFr(w.le) + ")" : "";
      if (w.suivi && w.quantite !== s.actuel) add("Écart avec le stock WooCommerce", true, s.a.nom + " : " + nb(s.actuel) + " dans l'outil, " + nb(w.quantite) + " déclarés sur le site" + le + ".", { stock: s.a.id });
      else if (!w.suivi && w.etat === "instock" && s.actuel <= 0) add("En vente sur le site sans stock", true, s.a.nom + " : le site le propose à la commande alors que le stock de l'outil est à " + nb(s.actuel) + le + ".", { stock: s.a.id });
      else if (!w.suivi && w.etat === "outofstock" && s.actuel > 0) add("En rupture sur le site avec du stock", false, s.a.nom + " : le site l'affiche en rupture alors qu'il en reste " + nb(s.actuel) + le + ".", { stock: s.a.id });
    }
    for (const t of C.trimestres) {
      if (!t.tri) continue;
      const reste = r2(t.total - t.verse);
      if (reste > 0.5 && joursDepuis(finTri(t.tri)) > 30) add("Rétrocession à reverser", false, triFr(t.tri) + " : " + eur(reste) + " restent à reverser au siège.", { retro: t.tri });
    }
    return out.sort((a, b) => b.grave - a.grave || a.type.localeCompare(b.type, "fr"));
  }

  // ------------------------------------------------------------ Rendu
  const TABS = [["synthese", "Synthèse"], ["stock", "Inventaires"], ["commandes", "Commandes"], ["retro", "Rétrocession"],
    ["achats", "Achats du siège"], ["catalogue", "Catalogue"], ["agences", "Agences"], ["controles", "Contrôles"], ["reglages", "Réglages"]];

  const table = (tetes, lignes, pied) => h("div", { class: "scroll" }, h("table", null,

  // Réduit une photo choisie sur l'ordinateur (480 px au plus, JPEG) pour qu'elle tienne dans la fiche de l'article.

  const stat = (v, l, cls, onclick) => h(onclick ? "button" : "div", { class: "stat " + (cls || ""), onclick }, h("span", { class: "v" }, v), h("span", { class: "l" }, l));

              h("td", { class: "r " + (t.total - t.verse > 0.5 ? "neg" : "") }, eur(t.total - t.verse)))))),
        h("section", { class: "bloc" }, h("h2", null, "Stocks les plus bas"),

            h("td", null, s.a.nom), h("td", { class: "r " + (s.actuel < 0 ? "neg" : "bas") }, nb(s.actuel)), h("td", { class: "r" }, nb(s.achete)))))
            : h("p", { class: "muted", style: "margin:0" }, "Aucun article sous " + SEUIL_BAS * 100 + " % de la quantité achetée."))),

  }

  // Trois lectures du stock : théorique (achats du siège − commandes des agences), réel (dernier comptage),
  // suivi (dernier comptage + achats − commandes datés d'après ; théorique tant que l'article n'a jamais été compté).
  const VUES_STOCK = [["theorique", "Inventaire théorique"], ["reel", "Inventaire réel"], ["suivi", "Inventaire suivi"]];
  const qteVue = (s, vue) => vue === "theorique" ? s.theorique : vue === "reel" ? (s.inv ? s.inv.quantite : null) : s.actuel;
  function vStock() {
    const cats = [...new Set(db.articles.map(a => a.categorie))].sort();
    const f = state.stock, vue = f.vue || "theorique";
    const filtre = () => { const q = slug(f.q); return C.stock.filter(s => (!f.cat || s.a.categorie === f.cat) && (!q || slug(s.a.nom).includes(q))); };
    const rows = filtre();
    const val = s => Math.max(qteVue(s, vue) || 0, 0) * s.pmp;
    const pos = C.stock.filter(x => (qteVue(x, vue) || 0) > 0);
    const comptes = C.stock.filter(x => x.inv), ecarts = comptes.filter(x => x.ecart);
    const dernier = comptes.reduce((d, x) => x.inv.date > d ? x.inv.date : d, "");
    const alerte = C.stock.filter(x => { const v = qteVue(x, vue); return v != null && (v < 0 || (x.achete && v <= x.achete * SEUIL_BAS)); }).length;
    const cartes = vue === "reel" ? [
        stat(comptes.length + " / " + C.stock.length, "Articles déjà comptés"),

    const ouvrir = c => () => { if (c.cible.cmd) pCommande(db.commandes.find(x => x.id === c.cible.cmd)); else if (c.cible.stock) { state.stock.q = C.art.get(c.cible.stock).nom; state.stock.cat = ""; state.stock.vue = "suivi"; go("stock"); } else if (c.cible.retro) { state.retroTri = c.cible.retro; go("retro"); } };
    return [h("p", { class: "muted", style: "margin:0" }, C.controles.length + " points à vérifier. Cette liste se vide au fur et à mesure des corrections ; cliquez une ligne pour l'ouvrir."),
      ...[...par.entries()].map(([type, lst]) => h("section", { class: "bloc" }, h("div", { class: "top" }, h("h3", null, type), h("span", { class: "pill" + (lst[0].grave ? "" : " zero") }, lst.length)),
        table(["À vérifier"], lst.map(c => h("tr", { class: "clic", onclick: ouvrir(c) }, h("td", null, c.texte))))))];
  }

  // Liens Sellsy : une tâche programmée (hors de la page) relie chaque heure factures et devis Sellsy aux fiches.
  // La page ne parle pas à Sellsy : le bouton dépose une demande dans stock_jt/base/etat/sellsy, traitée au passage suivant.
  const sellsy = { etat: null };
  const sellsyRef = () => fs.collection("stock_jt").doc("base").collection("etat").doc("sellsy");
  async function sellsyLire() { if (LOCAL) return; try { sellsy.etat = (await sellsyRef().get()).data() || {}; } catch (e) { console.warn("État Sellsy illisible", e); } }
  async function sellsyDemander() {
    if (LOCAL) return toast("Indisponible en mode essai.");
    try { const d = { demandeLe: new Date().toISOString(), demandePar: state.me.email }; await sellsyRef().set(d, { merge: true });
      sellsy.etat = { ...(sellsy.etat || {}), ...d }; toast("Demande enregistrée : elle sera traitée au prochain passage."); render(); }
    catch (e) { console.error(e); toast("La demande n'a pas pu être enregistrée."); }
  }
  function blocSellsy() {
    const e = sellsy.etat || {}, attente = e.demandeLe && (!e.faitLe || e.demandeLe > e.faitLe);
    const st = e.site;
    return h("section", { class: "bloc" }, h("h3", null, "Mises à jour automatiques"),
      st ? h("p", { class: "muted", style: "margin:0" }, "Commandes du nouveau site : " + nb(st.suivies || 0) + " reprise(s) dans l'outil, " + nb(st.lues || 0) + " lue(s) sur le site au dernier passage"
        + (st.sansArticle ? ", dont " + nb(st.sansArticle) + " sans article du catalogue (non reprises)" : "") + ". Seules les lignes d'articles du catalogue sont reprises, hors frais de port.") : null,
      h("p", { class: "muted", style: "margin:0" }, "Toutes les heures : nouvelles commandes du site, factures Sellsy (numéro, état, montant) et liens vers les factures et les devis. ",
        e.faitLe ? "Dernière mise à jour : " + quand(e.faitLe) + "." : "Aucune mise à jour automatique n'a encore eu lieu.",
        attente ? " Une mise à jour demandée le " + quand(e.demandeLe) + " est en attente." : ""),
      h("div", { class: "toolbar" }, h("button", { class: "btn", onclick: sellsyDemander }, "Demander une mise à jour"),
        h("button", { class: "btn", onclick: async () => { await sellsyLire(); await charger(); } }, "Recharger les données")));
  }
  function vReglages() {
    const fichier = h("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: e => importer(e.target.files[0]) });
    const mail = h("input", { type: "email", placeholder: "prenom.nom@exemple.com", "aria-label": "Adresse e-mail à autoriser", style: "flex:1 1 240px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px" });
    return [
      h("section", { class: "bloc" }, h("h3", null, "Données"), h("p", { class: "muted", style: "margin:0" }, db.commandes.length + " commandes, " + db.achats.length + " lignes d'achat du siège, " + db.articles.length + " articles, " + db.entites.length + " agences, " + db.inventaires.length + " comptages, " + db.versements.length + " versements."),
        h("div", { class: "toolbar" }, fichier, h("button", { class: "btn primary", onclick: () => fichier.click() }, "Importer un fichier de données"),
          h("button", { class: "btn", onclick: () => telecharger("stock-john-taylor-sauvegarde-" + auj() + ".json", JSON.stringify({ format: "stock-john-taylor/1", genere: new Date().toISOString(), ...Object.fromEntries(COLS.map(c => [c, db[c].map(nettoyer)])) }, null, 1), "application/json") }, "Télécharger une sauvegarde"),
          h("button", { class: "btn", onclick: async () => { await charger(); toast("Données actualisées."); } }, "Actualiser")),
        h("p", { class: "muted", style: "margin:0;font-size:13px" }, "L'import ajoute les nouvelles fiches et met à jour celles qui portent le même identifiant ; il ne supprime rien. Les commandes du nouveau site et le catalogue WooCommerce arrivent par ce même import.")),
      h("section", { class: "bloc" }, h("div", { class: "top" }, h("h3", null, "Sauvegardes automatiques"),
          h("button", { class: "btn small", onclick: async () => { try { toast("Sauvegarde en cours…"); const m = await creerSauvegarde("manuel", "Sauvegarde demandée"); toast(m ? "Sauvegarde créée." : "Rien à sauvegarder pour l'instant."); render(); } catch (e) { console.error(e); toast("Sauvegarde impossible (" + (e.code || e.message) + ")."); } } }, "Sauvegarder maintenant")),
        h("p", { class: "muted", style: "margin:0" }, "Une copie complète des données est enregistrée automatiquement dans la demi-minute qui suit chaque modification. Vous pouvez télécharger une copie ou remettre l'outil dans l'état où il était à ce moment-là."),
        S.erreur ? h("p", { class: "muted", style: "margin:0;color:var(--magenta)" }, "Les sauvegardes ne sont pas accessibles pour le moment (" + S.erreur + ").") : null,
        S.liste.length ? table(["Date", "Par", "Contenu", "", ""], (S.tout ? S.liste : S.liste.slice(0, 10)).map(x => h("tr", null,
          h("td", null, h("b", null, quand(x.date)), x.type === "manuel" || x.motif ? h("div", { class: "muted", style: "font-size:12.5px" }, x.motif || "Manuelle") : null),
          h("td", null, (x.par || "").split("@")[0]),
          h("td", { class: "muted" }, (x.compte?.commandes || 0) + " commandes, " + (x.compte?.achats || 0) + " achats, " + (x.compte?.versements || 0) + " versements, " + (x.compte?.inventaires || 0) + " comptages"),
          h("td", { class: "r" }, h("button", { class: "btn small", onclick: () => telechargerSauvegarde(x) }, "Télécharger")),
          h("td", { class: "r" }, h("button", { class: "btn small", onclick: () => restaurer(x) }, "Restaurer")))))
          : h("p", { class: "muted", style: "margin:0;font-size:13px" }, "Aucune sauvegarde pour l'instant. La première se crée dès que l'outil contient des données."),
        S.liste.length > 10 ? h("button", { class: "btn small", style: "justify-self:start", onclick: () => { S.tout = !S.tout; render(); } }, S.tout ? "Voir moins" : "Voir les " + S.liste.length + " sauvegardes") : null,
        h("p", { class: "muted", style: "margin:0;font-size:13px" }, "Les " + MAX_AUTO + " dernières sauvegardes automatiques sont conservées ; celles créées à la main ou avant une restauration ne sont jamais effacées.")),
      blocSellsy(),
      h("section", { class: "bloc" }, h("h3", null, "Historique des modifications"),
        S.journal.length ? table(["Date", "Par", "Modification"], (S.toutJ ? S.journal : S.journal.slice(0, 15)).map(e => h("tr", null,
          h("td", null, quand(e.date)), h("td", null, (e.par || "").split("@")[0]), h("td", null, h("b", null, e.action + " "), e.libelle || ""))))
          : h("p", { class: "muted", style: "margin:0;font-size:13px" }, "Aucune modification enregistrée pour l'instant."),
        S.journal.length > 15 ? h("button", { class: "btn small", style: "justify-self:start", onclick: () => { S.toutJ = !S.toutJ; render(); } }, S.toutJ ? "Voir moins" : "Voir les " + S.journal.length + " dernières modifications") : null),
      h("section", { class: "bloc" }, h("h3", null, "Accès"), h("p", { class: "muted", style: "margin:0" }, "Tous les comptes Google @smartshop.fr ont accès. Ajoutez ici les adresses Google externes à autoriser (par exemple la cliente)."),
        h("div", { class: "toolbar" }, mail, h("button", { class: "btn primary", onclick: async () => { const m = mail.value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return toast("Adresse e-mail invalide.");
          if (await sauver("acces", { id: m, ajoutePar: state.me.email, ajouteLe: auj() }, m + " peut maintenant se connecter.")) render(); } }, "Autoriser")),
        db.acces.length ? table(["Adresse", "Ajoutée par", ""], db.acces.map(a => h("tr", null, h("td", null, a.id), h("td", null, (a.ajoutePar || "") + (a.ajouteLe ? " · " + dateFr(a.ajouteLe) : "")),
          h("td", { class: "r" }, h("button", { class: "btn small danger", onclick: async () => { if (confirm("Retirer l'accès de " + a.id + " ?") && await supprimer("acces", a.id, "Accès retiré.")) render(); } }, "Retirer")))))
          : h("p", { class: "muted", style: "margin:0;font-size:13px" }, "Aucun accès externe.")),
    ];
  }
  const nettoyer = o => Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith("_")));
  async function importer(f) {
    if (!f) return;
    let d; try { d = JSON.parse(await f.text()); } catch (_) { return toast("Ce fichier n'est pas lisible."); }
    if (!String(d.format || "").startsWith("stock-john-taylor/")) return toast("Ce fichier n'est pas un fichier de données Stock John Taylor.");
    const cols = COLS.filter(c => Array.isArray(d[c]) && d[c].length);
    // Fichier « fusion » : complète les fiches existantes (ex. photos du catalogue) sans remplacer le reste ni créer de fiche.
    const fusion = d.fusion === true;
    const fiches = c => { const l = d[c].filter(x => x && x.id).map(nettoyer); if (!fusion) return l;
      return l.filter(x => db[c].some(y => y.id === x.id)).map(x => { const y = nettoyer(db[c].find(z => z.id === x.id)), r = { ...y, ...x };
        if (String(y.image || "").startsWith("data:")) r.image = y.image; return r; }); };
    if (!confirm(fusion ? "Compléter " + cols.map(c => fiches(c).length + " " + c).join(", ") + " ?\nSeules les informations du fichier sont ajoutées aux fiches existantes. Une photo ajoutée à la main est conservée."
      : "Importer " + cols.map(c => d[c].length + " " + c).join(", ") + " ?\nLes fiches déjà présentes avec le même identifiant seront remplacées.")) return;
    try { await sauvegardeAvant("Avant import");
      for (const c of cols) { toast("Import des " + c + "…"); await store.bulk(c, fiches(c)); }
      modifie({ col: "", action: "Import", libelle: cols.map(c => d[c].length + " " + c).join(", ") + " (" + f.name + ")" });
      toast("Import terminé."); go("synthese"); }
    catch (e) { console.error(e); toast(e.code === "permission-denied" ? "Import refusé : les règles d'accès Firebase ne sont pas en place." : "Import interrompu (" + (e.code || e.message) + ")."); render(); }
  }
  function telecharger(nom, contenu, type) { const a = h("a", { href: URL.createObjectURL(new Blob([contenu], { type })), download: nom }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  function exporterCsv(nom, lignes) {
    const cell = v => { v = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    telecharger(nom, "﻿" + lignes.map(l => l.map(cell).join(";")).join("\r\n"), "text/csv;charset=utf-8");
  }

  // ------------------------------------------------------------ Panneau
  const champ = (lbl, input) => { const id = uid("f"); input.id = id; return h("div", { class: "field" }, h("label", { for: id }, lbl), input); };
  let avant = null;
  function fermer() { $("#overlay").replaceChildren(); document.removeEventListener("keydown", echap); avant?.focus?.(); }
  function echap(e) { if (e.key === "Escape") fermer(); }
  function panneau(titre, corps, actions) {
    avant = document.activeElement;
    const p = h("aside", { class: "panel", role: "dialog", "aria-modal": "true", "aria-label": titre },
      h("div", { class: "panel-h" }, h("h3", null, titre), h("button", { class: "icon-btn", "aria-label": "Fermer", onclick: fermer }, "✕")),
      h("div", { class: "panel-body" }, corps),
      h("div", { class: "panel-f" }, h("button", { class: "btn", onclick: fermer }, "Annuler"), (actions || []).filter(Boolean).map(([lbl, fn, cls]) => h("button", { class: "btn " + (cls || ""), onclick: fn }, lbl))));
    $("#overlay").replaceChildren(h("div", { class: "scrim", onclick: fermer }), p);
    document.addEventListener("keydown", echap);
    p.querySelector("input:not([disabled]), select")?.focus();
  }

  // ------------------------------------------------------------ Démarrage
  const REGLES = `match /stock_jt/{document=**} {
  allow read, write: if request.auth != null && request.auth.token.email_verified == true
    && (request.auth.token.email.lower().matches('.*@smartshop[.]fr$')
        || exists(/databases/$(database)/documents/stock_jt_acces/$(request.auth.token.email.lower())));
}
match /stock_jt_acces/{email} {
  allow read: if request.auth != null && request.auth.token.email_verified == true
    && (request.auth.token.email.lower().matches('.*@smartshop[.]fr$') || request.auth.token.email.lower() == email);
  allow write: if request.auth != null && request.auth.token.email_verified == true
    && request.auth.token.email.lower().matches('.*@smartshop[.]fr$');
}`;
  async function charger() {
    try { await store.load(); await sellsyLire(); state.refus = false; $("#notice").replaceChildren(LOCAL ? h("div", { class: "banner" }, h("b", null, "Mode essai. "), "Les données restent dans ce navigateur et ne sont pas partagées.") : ""); }
    catch (e) {
      console.error("Stock JT", e);
      if (e.code === "permission-denied") { state.refus = true;
        $("#notice").replaceChildren(h("div", { class: "banner alerte" }, h("b", null, "Accès Firebase à ouvrir. "), "La base de l'outil n'est pas encore autorisée. Dans la console Firebase (projet smartshop-catalogues), Firestore > Règles, ajoutez ce bloc avant les deux dernières accolades fermantes, puis publiez :", h("pre", null, REGLES))); }
      else $("#notice").replaceChildren(h("div", { class: "banner alerte" }, "Chargement interrompu (" + (e.code || e.message) + "). Actualisez la page."));
    }
    state.loaded = true; render();
    if (!state.refus) rattraper();
  }

  const gate = $("#gate"), chip = $("#userChip");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const montrer = html => { document.body.classList.add("verrou"); gate.hidden = false;
    gate.innerHTML = '<div class="gate-card"><img src="/brand/smartshop-logo.png" alt="smartshop">' + html + "</div>";
    const b = gate.querySelector("button"); if (b) b.focus(); };
  if (LOCAL) { gate.hidden = true; document.body.classList.remove("verrou"); state.me = { email: "essai@local" }; chip.textContent = "Mode essai"; charger(); return; }
  if (!window.firebase) { montrer('<p class="gerr">Impossible de charger la connexion Google. Vérifiez votre connexion Internet puis actualisez la page.</p>'); return; }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  fs = firebase.firestore();
  function connexion(msg) {
    montrer("<h1>Stock John Taylor</h1><p>Suivi du stock et de la rétrocession John Taylor, réservé à l'équipe Smartshop et aux personnes autorisées. Connectez-vous avec votre compte Google.</p>"
      + (msg ? '<p class="gerr">' + esc(msg) + "</p>" : "") + '<button class="gbtn" id="gLogin">Se connecter avec Google</button>');
    document.getElementById("gLogin").onclick = async () => {
      try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch (e) {
        console.error("Connexion Google", e);
        if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")
          connexion("La fenêtre Google s'est fermée avant la fin de la connexion (" + e.code + "). Réessayez ; si cela se reproduit, autorisez les fenêtres pop-up pour ce site.");
        else connexion("La connexion a échoué (" + (e.code || e.message) + ").");
      }
    };
  }
  function refuse(u) {
    montrer("<h1>Accès non autorisé</h1><p>Le compte <b>" + esc(u.email) + "</b> n'a pas accès à cet outil. Il est réservé aux comptes Google <b>@smartshop.fr</b> et aux adresses autorisées dans ses réglages.</p>"
      + '<button class="gbtn secondaire" id="gOut">Changer de compte</button>');
    document.getElementById("gOut").onclick = () => auth.signOut();
  }
  function ouvrir(u) {
    gate.hidden = true; document.body.classList.remove("verrou");
    state.me = { email: u.email };
    chip.innerHTML = "<span>Connecté : " + esc(u.email) + '</span><button id="gOut2">Se déconnecter</button>';
    document.getElementById("gOut2").onclick = () => auth.signOut();
    charger();
  }
  auth.onAuthStateChanged(async u => {
    if (!u) { fermer(); return connexion(); }
    if (!u.emailVerified) return refuse(u);
    if (/@smartshop\.fr$/i.test(u.email || "")) return ouvrir(u);
    try { const d = await fs.collection("stock_jt_acces").doc(u.email.toLowerCase()).get(); d.exists ? ouvrir(u) : refuse(u); }
    catch (_) { refuse(u); }
  });
})();
</script>
</body>
</html>
