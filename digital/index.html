<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout : même charte que le Smarthub. Résumé, barre de filtres, puis une vue (priorités, statuts, échéances) ; un projet s'ouvre dans un panneau latéral. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #111214; --muted: #5E6470; --line: #E3E6EB;
  --magenta: #E50E7E; --yellow: #F2D600; --cyan: #1C9DD9; --hover: #F0F2F5; --green: #3BB273;
  --display: "Lexend", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --logo-filter: none;
  --st-cadrage: #B8BDC6; --st-demarrer: #5E6470; --st-cours: #1C9DD9; --st-test: #7A5CFA; --st-pause: #F2C200; --st-livre: #3BB273;
  --pr-critique: #E50E7E; --pr-haute: #F07B3F; --pr-normale: #5E6470; --pr-basse: #B8BDC6;
  --late: #E50E7E; --soon: #C27A00;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1114; --surface: #171A1F; --ink: #F1F2F4; --muted: #9AA1AD; --line: #2A2F37; --hover: #1E2228;
  --yellow: #F9EB1E; --logo-filter: invert(1) hue-rotate(180deg); color-scheme: dark;
  --st-cadrage: #6B7280; --st-demarrer: #9AA1AD; --pr-normale: #9AA1AD; --pr-basse: #5B6270; --soon: #F2C200; --late: #FF4FA3; } }
:root[data-theme="dark"] {
  --bg: #0F1114; --surface: #171A1F; --ink: #F1F2F4; --muted: #9AA1AD; --line: #2A2F37; --hover: #1E2228;
  --yellow: #F9EB1E; --logo-filter: invert(1) hue-rotate(180deg); color-scheme: dark;
  --st-cadrage: #6B7280; --st-demarrer: #9AA1AD; --pr-normale: #9AA1AD; --pr-basse: #5B6270; --soon: #F2C200; --late: #FF4FA3; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
header { display: grid; gap: 18px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { width: min(220px, 60vw); height: auto; filter: var(--logo-filter); display: block; }
.retour { font-size: 13.5px; color: var(--muted); text-decoration: none; }
.retour:hover { color: var(--ink); text-decoration: underline; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 64ch; }
.cmyk { display: inline-flex; gap: 5px; vertical-align: middle; margin-left: 6px; }
.cmyk i { width: 8px; height: 8px; border-radius: 50%; display: block; }
h2 { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--body); padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--magenta); }
.btn.danger.solid { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 1px solid transparent; background: none; border-radius: 8px; width: 30px; height: 30px; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; }

/* Résumé */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; text-align: left; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  transition: border-color .18s ease, transform .18s ease; }
.stat:hover { border-color: var(--ink); transform: translateY(-2px); }
.stat .v { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 13px; }
.stat.late .v { color: var(--late); } .stat.soon .v { color: var(--soon); } .stat.done .v { color: var(--green); }

/* Filtres */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input[type=search], .toolbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 38px; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tagbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tagbar .lbl { font-size: 12.5px; color: var(--muted); margin-right: 2px; }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tag); }
button.tag { padding: 5px 11px; font-size: 12.5px; }
button.tag[aria-pressed="true"] { border-color: var(--tag); background: color-mix(in srgb, var(--tag) 14%, var(--surface)); }
button.tag:hover { border-color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

.banner { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; color: var(--muted); }
.banner.alerte { border-color: var(--magenta); color: var(--ink); }
.banner.alerte b { color: var(--magenta); }

/* Liste */
.group { display: grid; gap: 8px; }
.group + .group { margin-top: 18px; }
.group-h { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.group-h .dot { width: 9px; height: 9px; border-radius: 50%; }
.group-h .count { font-family: var(--display); color: var(--muted); font-size: 12px; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 120px 150px 130px 150px; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--prio); border-radius: 12px; padding: 12px 14px 12px 10px;
  transition: border-color .18s ease; }
.row:hover { border-color: var(--ink); border-left-color: var(--prio); }
.rank { font-family: var(--display); color: var(--muted); font-size: 12.5px; text-align: center; font-variant-numeric: tabular-nums; }
.row-main { border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
.row-main .name { font-family: var(--display); font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.row-main .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row-actions { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
.row-actions select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 6px; font-size: 13px; max-width: 98px; }
.statut { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.statut::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--st); }
.prog { display: flex; align-items: center; gap: 8px; }
.bar { flex: 1; height: 8px; background: var(--hover); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--st); }
.prog .num { font-size: 12.5px; color: var(--muted); min-width: 38px; text-align: right; }
.due { display: grid; line-height: 1.3; font-size: 13px; font-variant-numeric: tabular-nums; }
.due .rel { font-size: 12px; color: var(--muted); }
.due.late, .due.late .rel { color: var(--late); font-weight: 600; }
.due.soon .rel { color: var(--soon); font-weight: 600; }
.due.none { color: var(--muted); }

/* Tableau par statut */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--hover); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 4px; }
.col-h .num { color: var(--muted); font-size: 12.5px; }
.card { display: grid; gap: 6px; text-align: left; width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--line);
  border-top: 3px solid var(--prio); border-radius: 12px; }
.card:hover { border-color: var(--ink); border-top-color: var(--prio); }
.card .name { font-family: var(--display); font-weight: 600; overflow-wrap: anywhere; }
.card .sub { color: var(--muted); font-size: 12.5px; }
.prio-tag { font: 500 11px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--prio); }
.empty-col { color: var(--muted); font-size: 13px; padding: 4px 2px; }
.empty { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 48px 16px; color: var(--muted);
  background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
.empty strong { color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 18px; }

/* Panneau projet */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .4); z-index: 20; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); z-index: 21; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -16px 0 40px -20px rgba(0,0,0,.4); display: flex; flex-direction: column; }
.panel-h { display: flex; align-items: flex-start; gap: 8px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.title-input { flex: 1; min-width: 0; border: 1px solid transparent; background: none; border-radius: 8px; padding: 4px 6px; margin-left: -6px;
  font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.25; }
.title-input:hover, .title-input:focus { border-color: var(--line); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 20px 32px; display: grid; gap: 22px; align-content: start; }
.meta { color: var(--muted); font-size: 13px; }
.saved { color: var(--green); font-weight: 600; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lbl { font: 500 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .add-form input, .add-form textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.field textarea { min-height: 90px; resize: vertical; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] { flex: 1; accent-color: var(--cyan); padding: 0; border: 0; }
.range-row .num { min-width: 46px; text-align: right; font-weight: 600; }
.sec { display: grid; gap: 10px; }
.add-form { display: grid; gap: 8px; }
.add-form textarea { min-height: 66px; resize: vertical; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.link-form { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; }
.notes, .docs { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.note { background: var(--hover); border-radius: 12px; padding: 10px 14px; }
.note .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.note .by { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.doc { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.doc .kind { font: 500 10.5px var(--display); letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 3px 7px; min-width: 46px; text-align: center;
  background: color-mix(in srgb, var(--cyan) 14%, var(--surface)); color: var(--ink); }
.doc .info { flex: 1; min-width: 0; }
.doc a { color: var(--ink); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.doc a:hover { text-decoration: underline; }
.doc .by { color: var(--muted); font-size: 12.5px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.muted { color: var(--muted); }
.danger-zone { border-top: 1px solid var(--line); padding-top: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 10px 24px -12px rgba(0,0,0,.5); }

/* Notifications */
.top-right { display: flex; align-items: center; gap: 14px; position: relative; }
.bell { position: relative; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.bell:hover, .bell[aria-expanded="true"] { border-color: var(--ink); }
.bell svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bell .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--magenta); color: #fff;
  font: 600 11.5px var(--body); display: grid; place-items: center; font-variant-numeric: tabular-nums; border: 2px solid var(--bg); }
.notifs { position: absolute; top: 48px; right: 0; z-index: 15; width: min(400px, calc(100vw - 32px)); max-height: min(520px, 70vh); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px -20px rgba(0,0,0,.45); }
.notifs-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.notifs ul { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.notif { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; border: 0; background: none; padding: 10px; border-radius: 10px; }
.notif:hover { background: var(--hover); }
.notif .pt { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--ev); }
.notif .txt { font-size: 14px; overflow-wrap: anywhere; }
.notif .txt b { font-weight: 600; }
.notif .quand { color: var(--muted); font-size: 12.5px; }
.notif.nouveau { background: color-mix(in srgb, var(--cyan) 9%, var(--surface)); }
.notif.nouveau .quand::after { content: " · nouveau"; color: var(--magenta); font-weight: 600; }
.notifs .vide { color: var(--muted); padding: 18px 16px; margin: 0; font-size: 14px; }

footer { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.user-chip { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.user-chip button { font: 500 13px var(--body); background: none; border: none; color: var(--ink); text-decoration: underline; cursor: pointer; padding: 0; }

/* Connexion Google @smartshop.fr (même principe que le Smarthub) */
body.verrou .wrap { display: none; }
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; display: grid; gap: 16px; }
.gate-card img { width: 200px; filter: var(--logo-filter); }
.gate-card h1 { font-size: 22px; }
.gate-card p { margin: 0; color: var(--muted); }
.gerr { color: var(--magenta) !important; }
.gbtn { font: 600 15px var(--body); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.gbtn.secondaire { background: transparent; color: var(--ink); }

@media (max-width: 900px) {
  .row { grid-template-columns: 26px minmax(0, 1fr) 120px; grid-template-areas: "rank main actions" ". statut due" ". prog prog"; row-gap: 8px; }
  .row .rank { grid-area: rank; } .row .row-main { grid-area: main; } .row .row-actions { grid-area: actions; }
  .row .statut { grid-area: statut; } .row .due { grid-area: due; } .row .prog { grid-area: prog; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fields, .link-form { grid-template-columns: 1fr; }
  .row { grid-template-columns: 22px minmax(0, 1fr); grid-template-areas: "rank main" ". statut" ". due" ". prog" ". actions"; }
  .row-actions { justify-content: flex-start; }
  .wrap { padding-block: 28px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: glisse .2s ease-out; }
  @keyframes glisse { from { transform: translateX(28px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

  }
  function refuse(u) {
    montrer("<h1>Accès non autorisé</h1><p>Le compte <b>" + esc(u.email) + "</b> n'a pas accès à cette page : elle est réservée aux comptes Google <b>@smartshop.fr</b>.</p>"
      + '<button class="gbtn secondaire" id="gOut">Changer de compte</button>');
    document.getElementById("gOut").onclick = () => auth.signOut();
  }
  function ouvrir(u) {
    gate.hidden = true; document.body.classList.remove("verrou");
    state.me = { email: u.email, nom: (u.displayName || "").split(" ")[0] || prenom(u.email) };
    chip.innerHTML = "<span>Connecté : " + esc(u.email) + '</span><button id="gOut2">Se déconnecter</button>';
    document.getElementById("gOut2").onclick = () => auth.signOut();
    $("#btn-new").hidden = false;
    demarrer();
  }
  auth.onAuthStateChanged(u => {
    if (!u) { if (unsubProjets) { unsubProjets(); unsubProjets = null; } arreterNotifs(); closePanel(); return connexion(); }
    const ok = u.emailVerified && /@smartshop\.fr$/i.test(u.email || "");
    ok ? ouvrir(u) : refuse(u);
  });
})();
</script>
</body>
</html>
